services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: sahayak-api

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: "postgresql+asyncpg://sahayak:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}@db:5432/sahayak"
      SCHEME_DATA_DIR: /app/seed-data
      CHROMA_PERSIST_DIRECTORY: /app/data/vector_store
      UPLOAD_DIR: /app/data/uploads

    volumes:
      - sahayak_data:/app/data

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: sahayak-db

    environment:
      POSTGRES_DB: sahayak
      POSTGRES_USER: sahayak
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahayak -d sahayak"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  pgdata:
  sahayak_data:
